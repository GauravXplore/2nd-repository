<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child{
            background-color: aliceblue;
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }
        .childContainer{
            background-color: rgb(181, 181, 119);
            padding: 14px;
            margin: 14px;
        }
        .container{
            background-color: rgb(183, 128, 61);
            padding: 14px;
            margin: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">I am a child</div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", (e)=>{
            e.stopPropagation();
            alert("Child was clicked")
        })
        document.querySelector(".childContainer").addEventListener("click", (e)=>{
            e.stopPropagation();
            alert("childContainer was clicked")
        })
        document.querySelector(".container").addEventListener("click", (e)=>{
           e. alert("Container was clicked")
        })   
     removeEventListener("click", (e)=>{
           e. alert("Container was clicked")
           //removes the selected event from the handler.
        
        })
    </script>
    <!-- When we click on the child childContainer is also clicked along with the container. For example, if we live in UP we are directly Indians and by same logic we are Asians. 
     
    
    
    Event Bubbling - If we are listening any event on a element the listener activates for the element but for its parent as well. It can be stopped via stopPropagation-->
</body>
</html>
